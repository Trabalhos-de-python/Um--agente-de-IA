[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "um-agente-de-ia"
version = "0.1.0"
description = "Projeto base de agente de IA com RAG, gestão de projetos e integração com modelos prontos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["um_agente_de_ia", "um_agente_de_ia.*"]
